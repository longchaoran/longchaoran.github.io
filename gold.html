<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>支付宝积存金实时金价</title>
    <style>
        body {
            text-align: center;
            padding: 30px;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }
        .title {
            font-size: 22px;
            color: #333;
            margin-bottom: 20px;
        }
        .price-box {
            font-size: 40px;
            color: #ff6600;
            font-weight: bold;
            margin: 15px 0;
        }
        .detail {
            font-size: 14px;
            color: #666;
            line-height: 24px;
        }
        .error {
            color: #ff3333;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="title">支付宝积存金参考价</div>
    <div class="price-box" id="goldPrice">加载中...</div>
    <div class="detail" id="updateTime"></div>

    <script>
        // 替换成国内稳定的金价接口（无需密钥）
        async function getGoldData() {
            try {
                // 接口返回格式：{price: "485.2", time: "2026-03-26 15:30"}
                const response = await fetch("https://gold-price-api.cn/api/au9999");
                if (!response.ok) throw new Error("接口返回异常");
                
                const result = await response.json();
                document.getElementById("goldPrice").innerText = `${result.price} 元/克`;
                document.getElementById("updateTime").innerText = `更新时间：${result.time}`;
            } catch (error) {
                document.getElementById("goldPrice").className = "price-box error";
                document.getElementById("goldPrice").innerText = "加载失败，刷新试试";
                console.log("错误原因：", error); // 方便排查
            }
        }

        // 首次加载+30秒刷新
        getGoldData();
        setInterval(getGoldData, 30000);
    </script>
</body>
</html>
